services:
  # 1. Main Database
  postgres:
    image: postgres:15-alpine
    container_name: template-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: template_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # 2. Object Storage (SeaweedFS)
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master
    ports:
      - "9333:9333"      # Master API
      - "19333:19333"    # Master gRPC
    command: "master -ip=seaweedfs-master -port=9333"
    volumes:
      - seaweedfs-master-data:/data
    networks:
      - app-network

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    ports:
      - "18080:8080"      # Volume Server (호스트:컨테이너)
    command: "volume -mserver=seaweedfs-master:9333 -port=8080 -ip=seaweedfs-volume -dir=/data"
    depends_on:
      - seaweedfs-master
    volumes:
      - seaweedfs-volume-data:/data
    networks:
      - app-network

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-filer
    ports:
      - "8888:8888"      # Filer HTTP
      - "18888:18888"    # Filer gRPC
    command: "filer -master=seaweedfs-master:9333 -port=8888 -defaultReplicaPlacement=000"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    volumes:
      - seaweedfs-filer-data:/data
    networks:
      - app-network

  # 3. Message Broker (Kafka)
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

volumes:
  seaweedfs-master-data:
    driver: local
  seaweedfs-volume-data:
    driver: local
  seaweedfs-filer-data:
    driver: local

networks:
  app-network:
    driver: bridge
